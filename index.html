<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Reader App</title>
    <link rel="manifest" href="./manifest.json">
    
    <!-- FIX 2: Proper Icons for PWA and iOS -->
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-180.png">
    
    <meta name="theme-color" content="#0c111b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --bg: #0c111b; --card: #141b29; --fg: #e6ebf5; --acc: #4f8cff; --line: #243049; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        
        #login-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; text-align: center; }
        #login-view.hidden { display: none; }
        #login-view h2 { margin-bottom: 20px; font-weight: 600; }
        input[type="password"] { width: 100%; max-width: 280px; padding: 16px; font-size: 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); text-align: center; letter-spacing: 4px; margin-bottom: 16px; outline: none; }
        input[type="password"]:focus { border-color: var(--acc); }
        button { width: 100%; max-width: 280px; padding: 16px; font-size: 16px; font-weight: 700; border-radius: 12px; border: none; background: var(--acc); color: #fff; cursor: pointer; }
        #error-msg { color: #ff6b6b; margin-top: 12px; font-size: 14px; min-height: 20px; }

        #app-view { display: none; width: 100%; height: 100%; }
        #app-view.active { display: block; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <div id="login-view">
        <h2>Enter PIN</h2>
        <input type="password" id="pin-input" inputmode="numeric" placeholder="****" maxlength="10">
        <button onclick="handleLogin()">Unlock</button>
        <div id="error-msg"></div>
    </div>

    <div id="app-view">
        <iframe id="reader-frame" src="about:blank" allow="fullscreen"></iframe>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWhjldeWhxb2tavaprVPDJwjGV0Vro_oA2_7r6kNs5MejgNlyDm6sHtEbeZa5EAJQd4A/exec";
        const SESSION_KEY = 'reader_session_active';
        const $ = id => document.getElementById(id);
        let loginTimer;

        // Register Service Worker
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

        // FIX: Verify the message comes from Google
        const trusted = o => o === 'https://script.google.com' || o.endsWith('.googleusercontent.com');

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem(SESSION_KEY) === 'true') {
                showApp();   // Auto-login
            } else {
                $('pin-input').focus();
            }
        });

        function handleLogin() {
            const pin = $('pin-input').value.trim();
            if (!pin) { $('error-msg').textContent = 'Please enter a PIN.'; return; }
            $('error-msg').textContent = 'Checking...';
            $('reader-frame').src = APPS_SCRIPT_URL + '?pin=' + encodeURIComponent(pin);
            clearTimeout(loginTimer);
            loginTimer = setTimeout(() => $('error-msg').textContent = 'No response. Try again.', 20000);
        }

        function showApp() {
            $('login-view').classList.add('hidden');
            $('app-view').classList.add('active');
            const f = $('reader-frame');
            if (f.src === 'about:blank' || !f.src) f.src = APPS_SCRIPT_URL;
        }

        function showLogin(msg) {
            localStorage.removeItem(SESSION_KEY);
            // Completely destroy the iframe to stop audio/reading
            const old = $('reader-frame'), nf = document.createElement('iframe');
            nf.id = 'reader-frame'; nf.src = 'about:blank'; nf.allow = 'fullscreen';
            old.replaceWith(nf);
            
            $('app-view').classList.remove('active');
            $('login-view').classList.remove('hidden');
            $('pin-input').value = '';
            $('error-msg').textContent = msg || '';
            $('pin-input').focus();
        }

        window.addEventListener('message', e => {
            if (!trusted(e.origin)) return;
            if (e.data === 'login_success') { 
                clearTimeout(loginTimer); 
                localStorage.setItem(SESSION_KEY, 'true'); 
                showApp(); 
            }
            else if (e.data === 'login_failed') { 
                clearTimeout(loginTimer); 
                showLogin('Invalid PIN. Try again.'); 
            }
            else if (e.data === 'logout') {
                showLogin('');
            }
        });
    </script>
</body>
</html>
